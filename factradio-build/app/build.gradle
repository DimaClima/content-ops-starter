plugins {
    id 'com.android.application'
}

def radioApiBaseUrl = providers.gradleProperty("RADIO_API_BASE_URL").orElse("").get()
def radioAppToken = providers.gradleProperty("RADIO_APP_TOKEN").orElse("").get()

android {
    namespace 'com.example.factradio'
    compileSdk 35
    testBuildType "release"

    defaultConfig {
        applicationId "com.factradio.app"
        minSdk 21
        targetSdk 35
        versionCode 15
        versionName "0.8.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "RADIO_API_BASE_URL", "\"${radioApiBaseUrl}\""
        buildConfigField "String", "RADIO_APP_TOKEN", "\"${radioAppToken}\""
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
