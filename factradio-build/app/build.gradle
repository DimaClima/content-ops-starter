plugins {
    id 'com.android.application'
}

def radioApiBaseUrl = providers.gradleProperty("RADIO_API_BASE_URL").orElse("").get()
def radioAppToken = providers.gradleProperty("RADIO_APP_TOKEN").orElse("").get()

android {
    namespace 'com.example.factradio'
    compileSdk 35
    testBuildType "release"

    defaultConfig {
        applicationId "com.factradio.app"
        minSdk 26
        targetSdk 29
        versionCode 11
        versionName "0.6.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "RADIO_API_BASE_URL", "\"${radioApiBaseUrl}\""
        buildConfigField "String", "RADIO_APP_TOKEN", "\"${radioAppToken}\""
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        // Private sideloaded build: target 29 intentionally keeps v1 signing
        // installable after the backend token is injected outside public CI.
        disable 'ExpiredTargetSdkVersion'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
