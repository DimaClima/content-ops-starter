name: FactRadio verified Android build

on:
  push:
    branches:
      - codex/factradio-build-20260824
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-install-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK from source
        working-directory: factradio-build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease lintRelease

      - name: Verify manifest and sign install-test copy
        working-directory: factradio-build
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee app/build/outputs/apk/release/badging.txt
          grep -q "package: name='com.factradio.app' versionCode='10' versionName='0.6.0'" app/build/outputs/apk/release/badging.txt
          grep -q "targetSdkVersion:'29'" app/build/outputs/apk/release/badging.txt
          keytool -genkeypair -noprompt -keystore /tmp/install-test.jks -storepass testpass -keypass testpass -alias test -keyalg RSA -keysize 2048 -validity 30 -dname "CN=FactRadio Install Test"
          cp "$APK" app/build/outputs/apk/release/app-install-test.apk
          "$SIGNER" sign --ks /tmp/install-test.jks --ks-pass pass:testpass --key-pass pass:testpass --ks-key-alias test --v1-signing-enabled true --v2-signing-enabled false app/build/outputs/apk/release/app-install-test.apk
          "$SIGNER" verify --verbose app/build/outputs/apk/release/app-install-test.apk

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r factradio-build/app/build/outputs/apk/release/app-install-test.apk
            adb shell pm path com.factradio.app
            adb shell am start -W -n com.factradio.app/com.example.factradio.MainActivity
            adb shell dumpsys package com.factradio.app | grep -q "versionName=0.6.0"

      - name: Upload unsigned source build
        uses: actions/upload-artifact@v4
        with:
          name: factradio-unsigned-source-build
          path: factradio-build/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

      - name: Publish verified build result on temporary branch
        if: github.event_name == 'push'
        run: |
          mkdir -p factradio-verified-output
          cp factradio-build/app/build/outputs/apk/release/app-release-unsigned.apk factradio-verified-output/FactRadio-0.6.0-unsigned.apk
          cp factradio-build/app/build/outputs/apk/release/badging.txt factradio-verified-output/badging.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f factradio-verified-output
          git commit -m "FactRadio build verified on Android emulator"
          git push origin HEAD:${{ github.ref_name }}
