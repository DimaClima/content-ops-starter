name: FactRadio 0.6.1 verified Android build

on:
  push:
    branches:
      - codex/factradio-061-fix-20260824
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Clean build, lint, and test APK
        working-directory: factradio-build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease lintRelease assembleAndroidTest

      - name: Verify APK identity, orientation, and Android Auto declarations
        working-directory: factradio-build
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee app/build/outputs/apk/release/badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > app/build/outputs/apk/release/manifest.txt
          grep -q "package: name='com.factradio.app' versionCode='11' versionName='0.6.1'" app/build/outputs/apk/release/badging.txt
          grep -q "targetSdkVersion:'29'" app/build/outputs/apk/release/badging.txt
          grep -q 'android:screenOrientation(0x0101001e)=10' app/build/outputs/apk/release/manifest.txt
          grep -q 'android.media.browse.MediaBrowserService' app/build/outputs/apk/release/manifest.txt
          grep -q 'com.google.android.gms.car.application' app/build/outputs/apk/release/manifest.txt
          keytool -genkeypair -noprompt -keystore /tmp/install-test.jks -storepass testpass -keypass testpass -alias test -keyalg RSA -keysize 2048 -validity 30 -dname "CN=FactRadio Install Test"
          cp "$APK" app/build/outputs/apk/release/app-install-test.apk
          "$SIGNER" sign --ks /tmp/install-test.jks --ks-pass pass:testpass --key-pass pass:testpass --ks-key-alias test --v1-signing-enabled true --v2-signing-enabled false app/build/outputs/apk/release/app-install-test.apk
          "$SIGNER" verify --verbose app/build/outputs/apk/release/app-install-test.apk

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, rotate, and run behavior tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -euxo pipefail
            APK=factradio-build/app/build/outputs/apk/release/app-install-test.apk
            TEST_APK=factradio-build/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb install -r "$APK"
            adb install -r "$TEST_APK"
            adb shell am start -W -n com.factradio.app/com.example.factradio.MainActivity
            adb shell dumpsys package com.factradio.app | grep -q 'versionName=0.6.1'

            # Keep Android's global rotation toggle locked. FactRadio must still follow
            # the physical sensor because many car mounts use the phone this way.
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            adb emu sensor set acceleration 0:9.81:0
            sleep 2
            adb emu sensor set acceleration 9.81:0:0
            for attempt in 1 2 3 4 5 6 7 8; do
              orientation=$(adb shell dumpsys input | sed -n 's/.*SurfaceOrientation: *\([0-9]\).*/\1/p' | head -1 | tr -d '\r')
              if [ "$orientation" = 1 ] || [ "$orientation" = 3 ]; then break; fi
              sleep 1
            done
            test "$orientation" = 1 -o "$orientation" = 3

            adb shell am instrument -w \
              com.factradio.app.test/androidx.test.runner.AndroidJUnitRunner \
              | tee /tmp/factradio-instrumentation.txt
            grep -q 'OK (4 tests)' /tmp/factradio-instrumentation.txt

      - name: Upload verified unsigned source APK
        uses: actions/upload-artifact@v4
        with:
          name: factradio-061-unsigned-source-build
          path: factradio-build/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
