name: Build Travel Assistant Android

on:
  push:
    branches: [main, travel-assistant-spain]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-travel-assistant-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK and AAB
        run: gradle -p android-app assembleDebug bundleDebug --stacktrace

      - name: Collect files
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk TravelAssistantSpain.apk
          cp android-app/app/build/outputs/bundle/debug/app-debug.aab TravelAssistantSpain.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TravelAssistantSpain-APK
          path: TravelAssistantSpain.apk
          if-no-files-found: error

      - name: Upload AAB for Google Play
        uses: actions/upload-artifact@v4
        with:
          name: TravelAssistantSpain-GooglePlay-AAB
          path: TravelAssistantSpain.aab
          if-no-files-found: error
